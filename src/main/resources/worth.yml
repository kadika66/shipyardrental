# Price per single block, keyed by Bukkit Material name.
# Anything not listed here falls back to "Default Block Worth" in config.yml.
# AIR/CAVE_AIR/VOID_AIR are always ignored regardless of what's listed here.
#
# Generated from a CMI Worth.yml economy export (converted from its
# "sellPrice;buyPrice" pairs to the buy price, since that reflects the actual
# replacement/materials cost of a block rather than a shop's discounted
# sell-back rate). A handful of CMI-specific entries were dropped because
# they're not plain Material names and wouldn't resolve here anyway:
# custom-model-data variants (e.g. "DIAMOND;cm{11001}") and sub-item variants
# (e.g. "SPAWNER>PIG", "ENCHANTED_BOOK>PROTECTION_ENVIRONMENTALx2").
#
# This is a full, decently-balanced default economy covering nearly every
# placeable block - most servers will only ever need to tweak a handful of
# entries here rather than build a price sheet from scratch.

